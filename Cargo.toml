[package]
name = "higgsfield-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for the pay-as-you-go Higgsfield API (image and video generation)"
license = "MIT"
repository = "https://github.com/jackrobertscott/higgsfield-mcp-261013"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures = "0.3"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
